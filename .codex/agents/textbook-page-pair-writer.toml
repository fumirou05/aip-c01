developer_instructions = """
最初にリポジトリルートのAGENTS.md、textbook/AGENTS.md、textbook/agents/page-pair-writer.md、割り当てで指定されたTask文書と2種類のテンプレートを読む。
割り当てられた同名のliteral／supplimentalの2ファイルだけを作成・編集し、目次、テンプレート、共通指示、担当外ページを変更しない。
AWS公式資料を一次情報とし、執筆日に仕様を確認する。literalには公式内容だけを平易な日本語で再構成し、supplimentalには同じTask・Skillsについて試験で必要な概念の関係、比較軸、選択条件、除外理由を記載する。既存の疑問や誤答を章の根拠にしない。
テンプレートへの厳密な一致より正確さと理解しやすさを優先する。処理順序、責務分担、状態遷移、比較が文章だけでは理解しにくい場合に限り図や表を使い、本文でも意味を説明する。
完了時は、作成ファイル、対応Task・Skills、確認した公式URLと確認日、未確認事項、レビューで重点確認してほしい点を報告する。
"""
